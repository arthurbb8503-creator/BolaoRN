<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Missões da Casa ✨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   MISSÕES DA CASA — Fase 1
   Tokens de design
   ============================================================ */
:root{
  --fundo:#FFF7EC;          /* papel de brincar */
  --tinta:#3B2E4A;          /* roxo-escuro amigável (texto) */
  --tinta-suave:#8B7FA0;
  --sol:#FFC531;            /* estrela / moeda */
  --sol-escuro:#E0A400;
  --verde:#34C77B;
  --verde-escuro:#22A863;
  --vermelho:#F76D6D;
  --branco:#FFFFFF;
  --cartao:#FFFFFF;
  --sombra:0 6px 0 rgba(59,46,74,.10);
  --raio:22px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--fundo);
  color:var(--tinta);
  font-family:'Nunito',sans-serif;
  font-size:17px;
  overscroll-behavior:none;
}
h1,h2,h3,.f{font-family:'Fredoka',sans-serif}
button{font-family:'Fredoka',sans-serif;border:none;cursor:pointer;color:inherit;background:none;font-size:inherit}
input,select,textarea{
  font-family:'Nunito',sans-serif;font-size:17px;color:var(--tinta);
  border:3px solid #EADDC8;border-radius:14px;padding:12px 14px;background:#fff;width:100%;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--sol)}
label{font-weight:800;font-size:14px;color:var(--tinta-suave);display:block;margin:14px 0 6px}

.tela{max-width:540px;margin:0 auto;padding:18px 16px 110px;min-height:100vh}

/* ---------- Botão de brinquedo (assinatura visual) ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-weight:600;border-radius:18px;padding:14px 22px;
  background:#fff;box-shadow:0 5px 0 rgba(59,46,74,.14);
  transition:transform .08s, box-shadow .08s;user-select:none;
}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(59,46,74,.14)}
.btn-grande{min-height:64px;font-size:21px;width:100%;border-radius:22px}
.btn-verde{background:var(--verde);color:#fff;box-shadow:0 5px 0 var(--verde-escuro)}
.btn-verde:active{box-shadow:0 1px 0 var(--verde-escuro)}
.btn-sol{background:var(--sol);color:#5C4300;box-shadow:0 5px 0 var(--sol-escuro)}
.btn-sol:active{box-shadow:0 1px 0 var(--sol-escuro)}
.btn-fantasma{background:transparent;box-shadow:none;color:var(--tinta-suave);font-weight:500}
.btn-fantasma:active{transform:none}
.btn-vermelho{background:#FFE7E7;color:#C23B3B;box-shadow:0 5px 0 #F3C4C4}
.btn:disabled{opacity:.55;pointer-events:none}

/* ---------- Home ---------- */
.home-titulo{text-align:center;font-size:34px;font-weight:700;margin:34px 0 6px}
.home-sub{text-align:center;color:var(--tinta-suave);font-weight:700;margin-bottom:30px}
.perfil-card{
  width:100%;display:flex;align-items:center;gap:18px;background:var(--cartao);
  border-radius:28px;padding:20px 22px;margin-bottom:18px;text-align:left;
  box-shadow:0 7px 0 var(--pc-sombra,rgba(59,46,74,.12));
  border:4px solid var(--pc-borda,#fff);
  transition:transform .08s, box-shadow .08s;
}
.perfil-card:active{transform:translateY(5px);box-shadow:0 2px 0 var(--pc-sombra,rgba(59,46,74,.12))}
.perfil-avatar{
  width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:46px;flex-shrink:0;background:var(--pa-fundo,#eee);
}
.perfil-nome{font-family:'Fredoka';font-size:27px;font-weight:600}
.perfil-info{color:var(--tinta-suave);font-weight:700;font-size:15px}
.rodape-pais{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;padding:14px;background:linear-gradient(transparent,var(--fundo) 40%)}

/* ---------- Cabeçalho da criança ---------- */
.cab{
  border-radius:26px;padding:18px;color:#fff;display:flex;align-items:center;gap:14px;
  box-shadow:var(--sombra);margin-bottom:16px;
}
.cab-avatar{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.28);display:flex;align-items:center;justify-content:center;font-size:36px;flex-shrink:0}
.cab-nome{font-family:'Fredoka';font-size:23px;font-weight:600;line-height:1.1}
.cab-nivel{font-size:13px;font-weight:800;opacity:.92;margin-top:3px}
.moedona{
  margin-left:auto;background:var(--sol);color:#5C4300;border-radius:20px;padding:10px 16px;
  font-family:'Fredoka';font-weight:700;font-size:24px;display:flex;align-items:center;gap:6px;
  box-shadow:0 4px 0 var(--sol-escuro);white-space:nowrap;
}
.barra-topo{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}

/* ---------- Abas ---------- */
.abas{display:flex;gap:10px;margin-bottom:16px}
.aba{
  flex:1;padding:13px 8px;border-radius:18px;font-weight:600;font-size:17px;background:#fff;
  box-shadow:0 4px 0 rgba(59,46,74,.10);color:var(--tinta-suave);position:relative;
}
.aba.ativa{background:var(--tinta);color:#fff;box-shadow:0 4px 0 rgba(59,46,74,.35)}
.badge{
  position:absolute;top:-7px;right:-4px;background:var(--vermelho);color:#fff;border-radius:99px;
  min-width:24px;height:24px;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 6px;
}

/* ---------- Cartão de missão ---------- */
.missao{
  width:100%;display:flex;align-items:center;gap:14px;background:#fff;border-radius:var(--raio);
  padding:14px 16px;margin-bottom:12px;text-align:left;min-height:88px;
  box-shadow:0 5px 0 rgba(59,46,74,.10);transition:transform .08s;
}
.missao:active{transform:scale(.985)}
.missao-selo{
  width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:33px;flex-shrink:0;
}
.missao-titulo{font-family:'Fredoka';font-size:19px;font-weight:600;line-height:1.15}
.missao-chip{font-size:13px;font-weight:800;color:var(--tinta-suave);margin-top:3px}
.missao-valor{
  margin-left:auto;font-family:'Fredoka';font-weight:700;font-size:20px;color:#B78600;
  display:flex;align-items:center;gap:3px;white-space:nowrap;
}
.missao.pendente{opacity:.68;background:#FFFBF2}
.missao.aprovada{background:#EBFAF2}
.missao.aprovada .missao-valor{color:var(--verde-escuro)}

/* ---------- Lojinha ---------- */
.loja-grade{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.premio{
  background:#fff;border-radius:var(--raio);padding:16px 12px;text-align:center;
  box-shadow:0 5px 0 rgba(59,46,74,.10);display:flex;flex-direction:column;gap:8px;align-items:center;
}
.premio-emoji{font-size:48px;line-height:1}
.premio-nome{font-family:'Fredoka';font-weight:600;font-size:17px}
.premio .btn{width:100%;padding:11px 8px;font-size:16px;border-radius:15px}
.btn-falta{background:#F2ECE0;color:var(--tinta-suave);box-shadow:0 4px 0 #E2D8C4;font-size:14px!important}

/* ---------- Sheet (gaveta) ---------- */
.sheet-fundo{
  position:fixed;inset:0;background:rgba(59,46,74,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;
  animation:aparecer .18s ease;
}
.sheet{
  background:var(--fundo);width:100%;max-width:540px;border-radius:30px 30px 0 0;padding:24px 20px 34px;
  max-height:88vh;overflow-y:auto;animation:subir .22s ease;
}
.sheet-alca{width:48px;height:6px;border-radius:99px;background:#DFD3BE;margin:0 auto 16px}
@keyframes subir{from{transform:translateY(60px);opacity:.4}to{transform:translateY(0);opacity:1}}
@keyframes aparecer{from{opacity:0}to{opacity:1}}
.sheet-emoji{font-size:76px;text-align:center;animation:pop .35s ease}
.sheet-titulo{font-family:'Fredoka';font-size:26px;font-weight:600;text-align:center;margin:8px 0 4px}
.sheet-sub{text-align:center;color:var(--tinta-suave);font-weight:700;margin-bottom:18px}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.15)}100%{transform:scale(1)}}

/* ---------- PIN ---------- */
.pin-pontos{display:flex;gap:16px;justify-content:center;margin:26px 0 30px}
.pin-ponto{width:20px;height:20px;border-radius:50%;background:#E8DCC6;transition:background .1s}
.pin-ponto.cheio{background:var(--tinta)}
.teclado{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:320px;margin:0 auto}
.tecla{
  height:72px;border-radius:20px;background:#fff;font-family:'Fredoka';font-size:28px;font-weight:600;
  box-shadow:0 5px 0 rgba(59,46,74,.12);transition:transform .06s, box-shadow .06s;
}
.tecla:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(59,46,74,.12)}
.pin-erro{animation:tremer .35s}
@keyframes tremer{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}

/* ---------- Painel dos pais ---------- */
.pais-item{
  background:#fff;border-radius:18px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;
  box-shadow:0 4px 0 rgba(59,46,74,.08);
}
.pais-item .info{flex:1;min-width:0}
.pais-item .titulo{font-weight:800;font-size:16px}
.pais-item .sub{font-size:13px;color:var(--tinta-suave);font-weight:700}
.mini-btn{
  width:48px;height:48px;border-radius:14px;font-size:20px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 0 rgba(59,46,74,.12);background:#fff;transition:transform .06s;
}
.mini-btn:active{transform:translateY(3px)}
.mini-btn.ok{background:var(--verde);box-shadow:0 4px 0 var(--verde-escuro)}
.mini-btn.nao{background:#FFE7E7;box-shadow:0 4px 0 #F3C4C4}
.selo-crianca{
  width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;
}
.secao-titulo{font-family:'Fredoka';font-weight:600;font-size:20px;margin:22px 0 12px;display:flex;align-items:center;justify-content:space-between}
.vazio{
  text-align:center;color:var(--tinta-suave);font-weight:700;padding:36px 20px;background:#FFFDF7;
  border:3px dashed #EADDC8;border-radius:var(--raio);
}
.chips-dias{display:flex;gap:6px;flex-wrap:wrap}
.chip-dia{padding:9px 0;width:42px;text-align:center;border-radius:12px;background:#fff;border:3px solid #EADDC8;font-weight:800;font-size:14px}
.chip-dia.on{background:var(--tinta);color:#fff;border-color:var(--tinta)}
.linha-2{display:flex;gap:10px}.linha-2>*{flex:1}
.check-linha{display:flex;align-items:center;gap:10px;background:#fff;border:3px solid #EADDC8;border-radius:14px;padding:12px 14px;margin-bottom:8px;font-weight:800}
.check-linha input{width:22px;height:22px;flex:none;accent-color:var(--verde)}
.pill-demo{font-size:12px;font-weight:800;background:#EFE7D6;color:#8A7A55;border-radius:99px;padding:5px 10px}

/* ---------- Estrela voando / confete ---------- */
#confeteCanvas{position:fixed;inset:0;pointer-events:none;z-index:200}
.ampulheta-gira{display:inline-block;animation:girar 2.4s ease-in-out infinite}
@keyframes girar{0%,70%{transform:rotate(0)}85%,100%{transform:rotate(180deg)}}

/* ---------- mini-jogos ---------- */
.jogoTela{position:fixed;inset:0;z-index:80;background:var(--fundo);display:flex;flex-direction:column;padding:14px;overflow-y:auto}
.jogoMiolo{max-width:540px;width:100%;margin:0 auto;display:flex;flex-direction:column;flex:1;min-height:0}
.jogoTopo{display:flex;align-items:center;gap:10px}
.jogoProg{flex:1;display:flex;gap:6px}
.jogoProg .p{flex:1;height:12px;border-radius:99px;background:#EFE7D6}
.jogoProg .p.ok{background:var(--verde)}
.jogoPergunta{font-family:'Fredoka';font-size:24px;font-weight:600;text-align:center;margin:14px 0 4px}
.objGrade{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-content:center;flex:1;padding:12px 0}
.obj{width:68px;height:68px;font-size:42px;display:flex;align-items:center;justify-content:center;border-radius:20px;background:#fff;box-shadow:0 5px 0 rgba(59,46,74,.12);transition:transform .1s}
.obj:active{transform:scale(.9)}
.obj.contado{background:var(--verde);box-shadow:0 5px 0 var(--verde-escuro)}
.obj.mini{width:50px;height:50px;font-size:28px}
.numCard{min-width:88px;height:100px;border-radius:22px;background:#fff;box-shadow:0 6px 0 rgba(59,46,74,.12);display:flex;align-items:center;justify-content:center;font-family:'Fredoka';font-size:48px;font-weight:700;padding:0 12px}
.numCard.oco{background:#FFF3D6;color:#B78600;border:3px dashed var(--sol)}
.chipNum{min-width:54px;height:54px;border-radius:14px;background:#fff;box-shadow:0 4px 0 rgba(59,46,74,.10);display:flex;align-items:center;justify-content:center;font-family:'Fredoka';font-size:22px;font-weight:600;padding:0 6px}
.chipNum.oco{background:#FFF3D6;color:#B78600;border:3px dashed var(--sol)}
.opcoes{display:flex;gap:14px;justify-content:center;padding:14px 0 24px;min-height:112px}
.opcao{width:88px;height:88px;border-radius:26px;background:#fff;font-family:'Fredoka';font-size:40px;font-weight:700;box-shadow:0 6px 0 rgba(59,46,74,.14);transition:transform .08s}
.opcao:active{transform:translateY(4px)}
.opcao.certa{background:var(--verde);color:#fff;box-shadow:0 6px 0 var(--verde-escuro)}
.opcao.errada{background:#FFE7E7;animation:tremer .35s;opacity:.55}
.faseRow{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:12px 14px;margin-bottom:8px;box-shadow:0 4px 0 rgba(59,46,74,.08)}
.faseRow.travada{opacity:.45}
.faseRow .fnum{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Fredoka';font-weight:700;background:#F4EDDE;flex-shrink:0}
.faseRow.atualF .fnum{background:var(--sol)}
.pontinhos{display:flex;gap:5px}
.pontinhos span{width:12px;height:12px;border-radius:50%;background:#EFE7D6}
.pontinhos span.on{background:var(--verde)}
.cartaoHistoria{background:#fff;border-radius:20px;padding:18px;font-size:19px;line-height:1.65;font-weight:600;box-shadow:0 4px 0 rgba(59,46,74,.08)}
.perguntaTexto{font-family:'Fredoka';font-size:19px;font-weight:600;margin:16px 4px 12px}
.opcaoTexto{display:block;width:100%;height:auto;min-height:56px;text-align:left;font-family:'Nunito';font-weight:800;font-size:16px;padding:14px 16px;border-radius:16px;margin-bottom:10px}
.estrelaNota{font-size:40px;opacity:.28;transition:opacity .1s, transform .1s}
.estrelaNota.on{opacity:1;transform:scale(1.1)}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheetContainer"></div>
<div id="jogoContainer"></div>
<canvas id="confeteCanvas"></canvas>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ============================================================
   CONFIGURAÇÃO — edite aqui
   ============================================================ */
const CONFIG = {
  PIN: '0611',
  CRIANCAS: [
    { id:'arthur',   nome:'Arthur',   avatar:'🦖', idade:5, cor:'#2F7DF6', corClara:'#E1EDFF', corSombra:'#1F5FC4', leitor:false },
    { id:'carolina', nome:'Carolina', avatar:'🦄', idade:7, cor:'#B44BE0', corClara:'#F6E9FF', corSombra:'#8E33B5', leitor:true  },
  ],
};

/* Firebase — mesmo projeto do Bolão ReseNha RN.
   Para voltar ao modo demo (localStorage), troque por: const firebaseConfig = null; */
const firebaseConfig = {
  apiKey: "AIzaSyC2IWlQBEt7ScYlZpEnfWrJRVSQx2aSALY",
  authDomain: "bolao-c5b50.firebaseapp.com",
  projectId: "bolao-c5b50",
  storageBucket: "bolao-c5b50.firebasestorage.app",
  messagingSenderId: "817557444967",
  appId: "1:817557444967:web:4741c1a0a4b9d2ecb1b7c2"
};

const FORMAS = {
  sozinha:  { rotulo:'Leu sozinha 💪',            trabalha:'autonomia'    },
  vozAlta:  { rotulo:'Leu em voz alta 🗣️',        trabalha:'fluência'     },
  comAjuda: { rotulo:'Leu com ajuda 🤝',           trabalha:'sem frustração'},
  contou:   { rotulo:'Contou o que entendeu 💭',   trabalha:'compreensão'  },
};
const TIPOS = { diaria:'Todo dia', semanal:'X vezes na semana', dias:'Dias específicos', avulsa:'Avulsa' };
const DIAS = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const CATEGORIAS = { rotina:'Rotina', leitura:'Leitura', educativa:'Educativa', avulsa:'Avulsa' };
const TETO_LEITURA = 4;

/* ============================================================
   BANCO (localStorage espelhando a estrutura Firestore)
   ============================================================ */
const LS_KEY = 'missoesCasa_v1';
let db = null;

function seedDB(){
  const M = {};
  const add = (id,titulo,emoji,valor,criancaIds,tipo,categoria,extra)=>{
    M[id] = Object.assign({titulo,emoji,valor,criancaIds,tipo,categoria,
      frequenciaSemanal:null,diasSemana:[],pedeForma:false,ativa:true},extra||{});
  };
  // Missões da casa — as duas crianças, 1 estrela cada
  add('m01','Escovar dentes','🪥',1,['arthur','carolina'],'diaria','rotina');
  add('m02','Guardar brinquedos','🧸',1,['arthur','carolina'],'diaria','rotina');
  add('m03','Fazer lição de casa','✏️',1,['arthur','carolina'],'diaria','rotina');
  add('m04','Tomar banho sem reclamar','🛁',1,['arthur','carolina'],'diaria','rotina');
  add('m05','Roupa no cesto','🧺',1,['arthur','carolina'],'diaria','rotina');

  const P = {
    p01:{ nome:'Escolher o filme da noite', emoji:'🎬', preco:8,  ativo:true },
    p02:{ nome:'Escolher o jantar',         emoji:'🍕', preco:10, ativo:true },
    p03:{ nome:'Sorvete',                   emoji:'🍦', preco:12, ativo:true },
    p04:{ nome:'Passeio especial',          emoji:'🎡', preco:35, ativo:true },
    p05:{ nome:'Brinquedo novo',            emoji:'🎁', preco:70, ativo:true },
  };
  const C = {};
  CONFIG.CRIANCAS.forEach(c=>{ C[c.id] = { saldo:0, totais:0, streak:0, ultimoDiaAtivo:null }; });
  return { criancas:C, missoes:M, premios:P, conclusoes:{}, resgates:{}, movimentos:{}, cartinhas:{}, trilhas:{}, livros:{} };
}

function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    db = raw ? JSON.parse(raw) : seedDB();
  }catch(e){ db = seedDB(); }
  // garante que crianças novas do CONFIG existam no banco
  if(!db.cartinhas) db.cartinhas = {};
  if(!db.trilhas) db.trilhas = {};
  if(!db.livros) db.livros = {};
  CONFIG.CRIANCAS.forEach(c=>{ if(!db.criancas[c.id]) db.criancas[c.id]={saldo:0,totais:0,streak:0,ultimoDiaAtivo:null}; });
  save();
}
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(db)); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* ---------- camada de escrita: localStorage (demo) OU Firestore ---------- */
const MODO_FB = !!firebaseConfig;
let fdb = null, auth = null, usuarioAtual = null;
function gravar(col, id, dados){
  db[col][id] = Object.assign({}, db[col][id]||{}, dados);
  if(MODO_FB) fdb.collection(col).doc(id).set(dados, {merge:true});
  else save();
}
function remover(col, id){
  delete db[col][id];
  if(MODO_FB) fdb.collection(col).doc(id).delete();
  else save();
}

/* ---------- datas ---------- */
function chaveDia(d){
  d = d || new Date();
  const p = n => String(n).padStart(2,'0');
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
}
function chaveInicioSemana(){ // segunda-feira
  const d = new Date();
  d.setDate(d.getDate() - ((d.getDay()+6)%7));
  return chaveDia(d);
}

/* ---------- economia (ledger sempre) ---------- */
function crianca(id){ return db.criancas[id]; }
function cfgCrianca(id){ return CONFIG.CRIANCAS.find(c=>c.id===id); }
function nivel(id){ return Math.floor(crianca(id).totais/50)+1; }
function proximoDia(key){
  const p = key.split('-');
  const d = new Date(+p[0], +p[1]-1, +p[2]);
  d.setDate(d.getDate()+1);
  return chaveDia(d);
}
function streakDe(id){
  const c = crianca(id);
  if(!c || !c.ultimoDiaAtivo) return 0;
  if(c.ultimoDiaAtivo===chaveDia() || proximoDia(c.ultimoDiaAtivo)===chaveDia()) return c.streak||0;
  return 0; // quebrou: mostra zero, sem alarde
}
function registrarStreak(criancaId, dataKey){
  const c = crianca(criancaId);
  const ultimo = c.ultimoDiaAtivo || null;
  if(ultimo === dataKey) return;
  if(ultimo && ultimo > dataKey) return; // aprovação retroativa não regride a sequência
  const novo = (ultimo && proximoDia(ultimo)===dataKey) ? (c.streak||0)+1 : 1;
  gravar('criancas', criancaId, { streak:novo, ultimoDiaAtivo:dataKey });
  if(novo>0 && novo % 7 === 0) mover(criancaId, 2, 'Bônus de sequência: '+novo+' dias seguidos! 🔥', null);
}
function mover(criancaId, valor, motivo, ref){
  const mid = uid();
  db.movimentos[mid] = { criancaId:criancaId, valor:valor, motivo:motivo, ref:ref||null, ts:Date.now() };
  const c = crianca(criancaId);
  c.saldo += valor;
  if(valor>0) c.totais += valor;
  if(c.saldo<0) c.saldo = 0;
  if(MODO_FB){
    fdb.collection('movimentos').doc(mid).set(db.movimentos[mid]);
    const upd = { saldo: firebase.firestore.FieldValue.increment(valor) };
    if(valor>0) upd.totais = firebase.firestore.FieldValue.increment(valor);
    fdb.collection('criancas').doc(criancaId).set(upd, {merge:true});
  } else save();
}

/* ---------- missões do dia ---------- */
function listar(col){ return Object.entries(db[col]).map(([id,v])=>Object.assign({id},v)); }
function conclusaoHoje(missaoId, criancaId){
  return listar('conclusoes').find(c=>c.missaoId===missaoId && c.criancaId===criancaId
    && c.dataKey===chaveDia() && c.status!=='recusada');
}
function contagemSemana(missaoId, criancaId){
  const ini = chaveInicioSemana();
  return listar('conclusoes').filter(c=>c.missaoId===missaoId && c.criancaId===criancaId
    && c.dataKey>=ini && c.status!=='recusada').length;
}
function missoesDeHoje(criancaId){
  const dow = new Date().getDay();
  return listar('missoes').filter(m=>{
    if(!m.ativa || !m.criancaIds.includes(criancaId)) return false;
    if(m.tipo==='dias' && !(m.diasSemana||[]).includes(dow)) return false;
    if(m.tipo==='semanal'){
      const feitas = contagemSemana(m.id, criancaId);
      if(feitas >= (m.frequenciaSemanal||1) && !conclusaoHoje(m.id, criancaId)) return false;
    }
    return true;
  });
}
function pendentesTotal(){
  return listar('conclusoes').filter(c=>c.status==='pendente').length
       + listar('resgates').filter(r=>r.status==='pendente').length;
}

   ÁUDIO — fala (pt-BR) e efeitos curtos
   ============================================================ */
let vozPT = null;
function carregarVozes(){
  const v = speechSynthesis.getVoices();
  vozPT = v.find(x=>x.lang==='pt-BR') || v.find(x=>x.lang && x.lang.indexOf('pt')===0) || null;
}
if('speechSynthesis' in window){
  carregarVozes();
  speechSynthesis.onvoiceschanged = carregarVozes;
}
function falar(txt){
  if(!('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(txt);
    u.lang = 'pt-BR'; if(vozPT) u.voice = vozPT;
    u.rate = 0.95; u.pitch = 1.1;
    speechSynthesis.speak(u);
  }catch(e){}
}

let audioCtx = null;
function ctxAudio(){
  if(!audioCtx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(AC) audioCtx = new AC();
  }
  if(audioCtx && audioCtx.state==='suspended') audioCtx.resume();
  return audioCtx;
}
document.addEventListener('touchstart', ctxAudio, {once:true});
document.addEventListener('click', ctxAudio, {once:true});
function nota(freq, quando, dur, tipo, vol){
  const ctx = ctxAudio(); if(!ctx) return;
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = tipo||'sine'; o.frequency.value = freq;
  const t = ctx.currentTime + (quando||0);
  g.gain.setValueAtTime(vol||0.18, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+dur);
  o.connect(g); g.connect(ctx.destination);
  o.start(t); o.stop(t+dur+0.05);
}
function sfxFeito(){ nota(523,0,.14); nota(659,.11,.14); nota(784,.22,.28); }
function sfxMoeda(){ nota(988,0,.09,'square',.10); nota(1319,.09,.18,'square',.10); }
function sfxOps(){ nota(220,0,.16,'sine',.10); }

/* ---------- confete ---------- */
function confete(){
  const cv = document.getElementById('confeteCanvas');
  const ctx2 = cv.getContext('2d');
  cv.width = innerWidth; cv.height = innerHeight;
  const cores = ['#FFC531','#2F7DF6','#B44BE0','#34C77B','#F76D6D','#FF9F45'];
  const pcs = [];
  for(let i=0;i<70;i++){
    pcs.push({
      x: cv.width/2 + (Math.random()-.5)*120,
      y: cv.height*0.35,
      vx:(Math.random()-.5)*11, vy:-(Math.random()*10+5),
      r: Math.random()*7+4, rot: Math.random()*Math.PI, vr:(Math.random()-.5)*.3,
      cor: cores[i%cores.length], estrela: Math.random()<.25
    });
  }
  let quadros = 0;
  (function anim(){
    ctx2.clearRect(0,0,cv.width,cv.height);
    pcs.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.vy+=0.35; p.rot+=p.vr;
      ctx2.save(); ctx2.translate(p.x,p.y); ctx2.rotate(p.rot);
      if(p.estrela){ ctx2.font=(p.r*2.4)+'px serif'; ctx2.fillText('⭐',-p.r,p.r); }
      else{ ctx2.fillStyle=p.cor; ctx2.fillRect(-p.r/2,-p.r,p.r,p.r*2); }
      ctx2.restore();
    });
    if(++quadros<90) requestAnimationFrame(anim);
    else ctx2.clearRect(0,0,cv.width,cv.height);
  })();
}

  });
  if(!itens.length) return '<div class="vazio">Tudo aprovado por aqui! 🎉</div>';
  itens.sort((a,b)=>a.ts-b.ts);
  return itens.map(i=>i.html).join('');
}

function clicarAprovar(conclusaoId){
  const c = db.conclusoes[conclusaoId]; if(!c || c.status!=='pendente') return;
  const m = db.missoes[c.missaoId];
  if(m && m.pedeForma){
    let botoes = Object.keys(FORMAS).map(k=>
      '<button class="btn btn-grande" style="margin-bottom:10px;justify-content:space-between" onclick="aprovarConclusao(\''+conclusaoId+'\',\''+k+'\')">' +
      '<span>'+FORMAS[k].rotulo+'</span><span style="font-size:13px;color:var(--tinta-suave)">'+FORMAS[k].trabalha+'</span></button>').join('');
    abrirSheet('<div class="sheet-emoji">'+m.emoji+'</div>' +
      '<div class="sheet-titulo">Como ela concluiu?</div>' +
      '<div class="sheet-sub">Fica registrado no histórico para acompanhar a evolução</div>' +
      botoes + '<button class="btn btn-grande btn-fantasma" onclick="fecharSheet()">Cancelar</button>');
  } else {
    aprovarConclusao(conclusaoId, null);
  }
}
function aprovarConclusao(conclusaoId, forma){
  const c = db.conclusoes[conclusaoId]; if(!c || c.status!=='pendente') return;
  const m = db.missoes[c.missaoId];
  gravar('conclusoes', conclusaoId, { status:'aprovada', formaConclusao: forma||null });
  mover(c.criancaId, m.valor, 'Missão: '+m.titulo + (forma ? ' — '+FORMAS[forma].rotulo : ''), conclusaoId);
  registrarStreak(c.criancaId, c.dataKey);
  sfxMoeda(); fecharSheet(); renderPais();
}
function recusarConclusao(conclusaoId){
  const c = db.conclusoes[conclusaoId]; if(!c) return;
  gravar('conclusoes', conclusaoId, { status:'recusada' }); renderPais();
}
function aprovarResgate(resgateId){
  const r = db.resgates[resgateId]; if(!r || r.status!=='pendente') return;
  const p = db.premios[r.premioId], c = crianca(r.criancaId);
  if(c.saldo < p.preco){
    alert('Saldo insuficiente: '+cfgCrianca(r.criancaId).nome+' tem '+c.saldo+' ⭐ e o prêmio custa '+p.preco+' ⭐. O pedido continua pendente.');
    return;
  }
  gravar('resgates', resgateId, { status:'aprovado' });
  mover(r.criancaId, -p.preco, 'Prêmio: '+p.nome, resgateId);
  sfxMoeda(); renderPais();
}
function recusarResgate(resgateId){
  const r = db.resgates[resgateId]; if(!r) return;
  gravar('resgates', resgateId, { status:'recusado' }); renderPais();
}

function salvarMissao(id){
  const titulo = document.getElementById('fm-titulo').value.trim();
  const emoji = document.getElementById('fm-emoji').value.trim() || '⭐';
  let valor = parseInt(document.getElementById('fm-valor').value,10) || 1;
  const criancaIds = Array.from(document.querySelectorAll('.fm-crianca:checked')).map(x=>x.value);
  const tipo = document.getElementById('fm-tipo').value;
  const categoria = document.getElementById('fm-cat').value;
  const pedeForma = document.getElementById('fm-forma').checked;
  if(!titulo){ alert('Dê um título para a missão.'); return; }
  if(!criancaIds.length){ alert('Escolha pelo menos uma criança.'); return; }
  if(categoria==='leitura' && valor>TETO_LEITURA){
    valor = TETO_LEITURA;
    alert('Teto de leitura: missões de leitura valem no máximo '+TETO_LEITURA+' ⭐ (o reforço principal vem do reconhecimento, não do prêmio). Valor ajustado.');
  }
  const dados = { titulo, emoji, valor, criancaIds, tipo, categoria, pedeForma,
    frequenciaSemanal: tipo==='semanal' ? (parseInt(document.getElementById('fm-freq').value,10)||3) : null,
    diasSemana: tipo==='dias' ? Array.from(document.querySelectorAll('#fm-dias .chip-dia.on')).map(x=>parseInt(x.dataset.dia,10)) : [],
    ativa: id ? db.missoes[id].ativa : true };
  gravar('missoes', id || uid(), dados);
  fecharSheet(); renderPais();
}

function excluirMissao(id){
  const m = db.missoes[id]; if(!m) return;
  if(!confirm('Excluir "'+m.titulo+'" para sempre?\n\nDica: se a ideia é só pausar, use Arquivar (📦) — o histórico e as estrelas já ganhas são preservados de qualquer forma.')) return;
  // remove conclusões pendentes dessa missão (aprovadas ficam no histórico/ledger)
  Object.keys(db.conclusoes).forEach(cid=>{
    if(db.conclusoes[cid].missaoId===id && db.conclusoes[cid].status==='pendente') remover('conclusoes', cid);
  });
  remover('missoes', id);
  fecharSheet(); renderPais();
}

/* ============================================================
   RELATÓRIO 📊
   ============================================================ */
function inicioSemanaData(n){
  const d = new Date(); d.setHours(0,0,0,0);
  d.setDate(d.getDate() - ((d.getDay()+6)%7) - 7*n);
  return d;
}
function htmlRelatorio(){
  let html = '';
  CONFIG.CRIANCAS.forEach(c=>{
    const d = crianca(c.id);
    const semanas = []; let max = 1;
    for(let n=3; n>=0; n--){
      const ini = inicioSemanaData(n), fim = inicioSemanaData(n-1);
      const soma = listar('movimentos')
        .filter(mv=>mv.criancaId===c.id && mv.valor>0 && mv.ts>=ini.getTime() && mv.ts<fim.getTime())
        .reduce((s,mv)=>s+mv.valor, 0);
      semanas.push({ rotulo:('0'+ini.getDate()).slice(-2)+'/'+('0'+(ini.getMonth()+1)).slice(-2), soma:soma });
      if(soma>max) max = soma;
    }
    const iniSem = chaveInicioSemana();
    const cs = listar('conclusoes').filter(x=>x.criancaId===c.id && x.dataKey>=iniSem);
    const apr = cs.filter(x=>x.status==='aprovada').length;
    const pend = cs.filter(x=>x.status==='pendente').length;
    const formas = listar('conclusoes').filter(x=>x.criancaId===c.id && x.formaConclusao);
    let formasHtml = '';
    if(formas.length){
      const cont = {};
      formas.forEach(x=>{ cont[x.formaConclusao] = (cont[x.formaConclusao]||0)+1; });
      formasHtml = '<div style="font-size:13px;font-weight:800;color:var(--tinta-suave);margin-top:8px">Leitura: ' +
        Object.keys(cont).map(k=>FORMAS[k].rotulo+' ×'+cont[k]).join(' · ') + '</div>';
    }
    html += '<div style="background:#fff;border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 4px 0 rgba(59,46,74,.08)">' +
      '<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">'+seloDe(c.id)+
      '<div><div style="font-family:Fredoka;font-weight:600;font-size:18px">'+esc(c.nome)+'</div>' +
      '<div style="font-size:13px;font-weight:800;color:var(--tinta-suave)">Nível '+nivel(c.id)+' · 🔥 '+streakDe(c.id)+' dia(s) · saldo '+d.saldo+' ⭐ · total '+d.totais+' ⭐</div></div></div>';
    semanas.forEach(s=>{
      html += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">' +
        '<span style="font-size:12px;font-weight:800;color:var(--tinta-suave);width:42px">'+s.rotulo+'</span>' +
        '<div style="flex:1;background:#F2ECE0;border-radius:8px;height:22px;overflow:hidden"><div style="height:100%;width:'+Math.round(s.soma/max*100)+'%;background:'+c.cor+';border-radius:8px"></div></div>' +
        '<span style="font-size:13px;font-weight:800;width:46px;text-align:right">'+s.soma+' ⭐</span></div>';
    });
    let trilhasHtml = '';
    trilhasDe(c.id).forEach(t=>{
      const pt = progTrilha(c.id, t.id);
      const completa = pt.fase >= t.fases.length;
      trilhasHtml += '<div style="font-size:13px;font-weight:800;color:var(--tinta-suave);margin-top:4px">'+t.emoji+' '+t.nome+': '+
        (completa ? 'completa 🏆' : 'fase '+(pt.fase+1)+' de '+t.fases.length+' · '+(pt.sessoes||0)+'/3 sessões')+'</div>';
    });
    if(c.leitor){
      const nl = listar('livros').filter(l=>l.criancaId===c.id).length;
      trilhasHtml += '<div style="font-size:13px;font-weight:800;color:var(--tinta-suave);margin-top:4px">📚 Diário de leitura: '+nl+' livro(s) registrado(s)</div>';
    }
    html += '<div style="font-size:13px;font-weight:800;color:var(--tinta-suave);margin-top:8px">Esta semana: '+apr+' missão(ões) aprovada(s)'+(pend?' · '+pend+' aguardando':'')+'</div>' + formasHtml + trilhasHtml;
    const hist = listar('conclusoes').filter(x=>x.criancaId===c.id).sort((a,b)=>b.ts-a.ts).slice(0,8);
    if(hist.length){
      html += '<div style="margin-top:12px;border-top:2px dashed #EFE7D6;padding-top:10px">' + hist.map(x=>{
        const m = db.missoes[x.missaoId];
        const st = x.status==='aprovada' ? '✅' : (x.status==='pendente' ? '⏳' : '✖️');
        return '<div style="font-size:13px;font-weight:700;color:var(--tinta-suave);padding:3px 0">'+st+' '+
          (m ? m.emoji+' '+esc(m.titulo) : '(missão excluída)') +
          (x.formaConclusao ? ' — '+FORMAS[x.formaConclusao].rotulo : '') +
          ' · '+x.dataKey.slice(8,10)+'/'+x.dataKey.slice(5,7)+'</div>';
      }).join('') + '</div>';
    }
    html += '</div>';
  });
  return html;
}

  CONFIG.CRIANCAS.forEach(c=>{ b.criancas[c.id] = { saldo:0, totais:0, streak:0, ultimoDiaAtivo:null }; });

function recalcularSaldos(){
  if(!MODO_FB){ alert('Só funciona no modo nuvem.'); return; }
  if(!confirm('Recalcular os saldos somando todo o histórico de movimentos?')) return;
  fdb.collection('movimentos').get().then(snap=>{
    const acc = {};
    snap.forEach(doc=>{
      const m = doc.data(), v = Number(m.valor)||0;
      if(!acc[m.criancaId]) acc[m.criancaId] = { saldo:0, totais:0 };
      acc[m.criancaId].saldo += v;
      if(v>0) acc[m.criancaId].totais += v;
    });
    const batch = fdb.batch();
    Object.keys(acc).forEach(id=>{
      const saldo = acc[id].saldo < 0 ? 0 : acc[id].saldo;
      batch.set(fdb.collection('criancas').doc(id), { saldo, totais:acc[id].totais }, {merge:true});
    });
    return batch.commit().then(()=>{ alert('Saldos recalculados pelo histórico ✅'); location.reload(); });
  }).catch(e=>alert('Erro: '+(e.message||e)));
}
function restaurarMissoes(){
  if(!MODO_FB){ alert('Só funciona no modo nuvem.'); return; }
  if(!confirm('Restaurar as missões do app? Substitui a lista atual de missões. Saldos e histórico NÃO são afetados.')) return;
  const novas = seedDB().missoes;
  fdb.collection('missoes').get().then(snap=>{
    const batch = fdb.batch();
    snap.forEach(doc=>batch.delete(doc.ref));
    Object.keys(novas).forEach(id=>batch.set(fdb.collection('missoes').doc(id), novas[id]));
    return batch.commit();
  }).then(()=>{ alert('Missões restauradas ✅'); location.reload(); })
    .catch(e=>alert('Erro: '+(e.message||e)));
}
function seedSeVazio(){
  return fdb.collection('missoes').limit(1).get().then(snap=>{
    if(!snap.empty) return;
    const base = seedDB();
    const batch = fdb.batch();
    Object.keys(base.missoes).forEach(id=>batch.set(fdb.collection('missoes').doc(id), base.missoes[id]));
    Object.keys(base.premios).forEach(id=>batch.set(fdb.collection('premios').doc(id), base.premios[id]));
    // NUNCA zerar criança existente: só cria doc para quem ainda não existe
    return fdb.collection('criancas').get().then(cs=>{
      const existe = {}; cs.forEach(d=>existe[d.id]=true);
      CONFIG.CRIANCAS.forEach(c=>{
        if(!existe[c.id]) batch.set(fdb.collection('criancas').doc(c.id), { saldo:0, totais:0, streak:0, ultimoDiaAtivo:null });
      });
      return batch.commit();
    });
  });
}
let fbLigado = false;
function ligarFirestore(){
  if(fbLigado){ renderHome(); return; }
  fbLigado = true;
  ['criancas','missoes','premios','conclusoes','resgates','movimentos','cartinhas','trilhas','livros'].forEach(col=>{
    fdb.collection(col).onSnapshot(snap=>{
      const mapa = {};
      snap.forEach(doc=>{ mapa[doc.id] = doc.data(); });
      if(col==='criancas') CONFIG.CRIANCAS.forEach(c=>{ if(!mapa[c.id]) mapa[c.id]={saldo:0,totais:0,streak:0,ultimoDiaAtivo:null}; });

/* ============================================================
   TRILHAS EDUCATIVAS 🎮
   Referências: BNCC EI03ET07 (números/quantidades/sequência),
   Gelman & Gallistel 1978 (correspondência 1-a-1 e cardinalidade),
   Clements & Sarama (trajetórias de aprendizagem, subitização).
   Regras: sessão = 5 exercícios · 3 sessões dominam a fase ·
   fase dominada = +2 ⭐ (esforço, não acerto) · erro sem punição.
   ============================================================ */
const EMOJIS_JOGO = ['🍎','⭐','🐟','🎈','🐞','🌸','⚽','🦆','🍓','🐤'];
const LIMITE_TRILHA_DIA = 5; // teto de estrelas por dia vindas dos jogos (marcadas com 🎯)

function estrelasTrilhaHoje(criancaId){
  const ini = new Date(); ini.setHours(0,0,0,0);
  return listar('movimentos')
    .filter(mv=>mv.criancaId===criancaId && mv.valor>0 && mv.ts>=ini.getTime() && String(mv.motivo).indexOf('🎯')!==-1)
    .reduce((s,mv)=>s+mv.valor, 0);
}

function irand(n){ return Math.floor(Math.random()*n); }
function embaralhar(a){
  for(let i=a.length-1;i>0;i--){ const j=irand(i+1); const t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function opcoesNum(certa, min, max){
  const set = [certa];
  let guard = 0;
  const deltas = [1,-1,2,-2,3,-3];
  while(set.length<3 && guard++<60){
    const v = certa + deltas[irand(deltas.length)];
    if(v>=min && v<=max && set.indexOf(v)===-1) set.push(v);
  }
  let k = Math.max(min,0);
  while(set.length<3){ if(set.indexOf(k)===-1) set.push(k); k++; }
  return embaralhar(set);
}
function exContar(min, max){
  const qtd = min + irand(max-min+1);
  return { tipo:'contar', qtd:qtd, certa:qtd, emoji:EMOJIS_JOGO[irand(EMOJIS_JOGO.length)], opcoes:opcoesNum(qtd, 1, max+2) };
}
function exQuantos(min, max){
  const qtd = min + irand(max-min+1);
  return { tipo:'quantos', qtd:qtd, certa:qtd, emoji:EMOJIS_JOGO[irand(EMOJIS_JOGO.length)], opcoes:opcoesNum(qtd, 1, max+2) };
}
function exSeq(max){
  const t = ['depois','antes','entre'][irand(3)];
  if(t==='depois'){ const n = 1+irand(max-1); return { tipo:'depois', n:n, certa:n+1, opcoes:opcoesNum(n+1, 0, max+1) }; }
  if(t==='antes'){ const n = 2+irand(max-1); return { tipo:'antes', n:n, certa:n-1, opcoes:opcoesNum(n-1, 0, max+1) }; }
  const n = 1+irand(max-2);
  return { tipo:'entre', a:n, b:n+2, certa:n+1, opcoes:opcoesNum(n+1, 0, max+1) };
}
function exDezena(){
  const falta = 10*(1+irand(10));
  const cand = embaralhar([falta-10, falta+10, falta-20, falta+20].filter(v=>v>=10 && v<=100 && v!==falta));
  return { tipo:'dezena', certa:falta, opcoes:embaralhar([falta].concat(cand.slice(0,2))) };
}
function exCem(){
  const ini = 10*(1+irand(9))+1; // janelas 11–20 … 91–100
  const falta = ini + irand(10);
  const cand = embaralhar([falta-1, falta+1, falta-10, falta+10].filter(v=>v>=1 && v<=100 && v!==falta));
  return { tipo:'cem', ini:ini, certa:falta, opcoes:embaralhar([falta].concat(cand.slice(0,2))) };
}

/* ---------- tela da trilha (dentro do mundo da criança) ---------- */
function htmlTrilhas(c){
  const ts = trilhasDe(c.id);
  if(!ts.length) return '<div class="vazio">Os joguinhos chegam em breve! 🎈</div>';
  return ts.map(t=>{
    const pr = progTrilha(c.id, t.id);
    const completa = pr.fase >= t.fases.length;
    const atualIdx = Math.min(pr.fase, t.fases.length-1);
    const f = t.fases[atualIdx];
    let html = '<div style="background:#fff;border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:0 5px 0 rgba(59,46,74,.10)">' +
      '<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">' +
      '<div class="missao-selo" style="background:'+cfgCrianca(c.id).corClara+'">'+t.emoji+'</div>' +
      '<div style="flex:1;min-width:0"><div class="missao-titulo">'+t.nome+'</div>' +
      '<div class="missao-chip">'+(completa?'Trilha completa! 🏆':'Fase '+(atualIdx+1)+' de '+t.fases.length+' · '+f.nome)+'</div></div></div>' +
      '<button class="btn btn-grande btn-verde" onclick="iniciarSessao(\''+t.id+'\')">Jogar ▶</button>' +
      '<div style="margin-top:14px">';
    t.fases.forEach((fs,i)=>{
      let cls = '', ic = '🔒';
      if(i < pr.fase){ ic = '⭐'; }
      else if(i === pr.fase && !completa){ ic = ''+(i+1); cls = ' atualF'; }
      else { cls = ' travada'; }
      html += '<div class="faseRow'+cls+'"><div class="fnum">'+ic+'</div>' +
        '<div style="flex:1;min-width:0"><div style="font-weight:800;font-size:15px">'+fs.nome+'</div>' +
        '<div style="font-size:12px;color:var(--tinta-suave);font-weight:700">'+fs.comp+'</div></div>';
      if(i === pr.fase && !completa){
        html += '<div class="pontinhos">';
        for(let k=0;k<3;k++) html += '<span class="'+(k<(pr.sessoes||0)?'on':'')+'"></span>';
        html += '</div>';
      }
      html += '</div>';
    });
    return html + '</div></div>';
  }).join('');
}

/* ---------- diário de leitura (leitores) ---------- */
function htmlAtividades(c){
  let html = htmlTrilhas(c);
  if(cfgCrianca(c.id).leitor) html += htmlDiario(c);
  return html;
}
function htmlDiario(c){
  const livros = listar('livros').filter(l=>l.criancaId===c.id).sort((a,b)=>b.ts-a.ts);
  let html = '<div style="background:#fff;border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:0 5px 0 rgba(59,46,74,.10)">' +
    '<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">' +
    '<div class="missao-selo" style="background:'+cfgCrianca(c.id).corClara+'">📚</div>' +
    '<div style="flex:1;min-width:0"><div class="missao-titulo">Meu Diário de Leitura</div>' +
    '<div class="missao-chip">'+livros.length+' livro(s) na estante</div></div></div>' +
    '<button class="btn btn-grande btn-sol" onclick="formLivro()">Registrar livro 📖</button>';
  if(livros.length){
    html += '<div style="margin-top:14px">' + livros.slice(0,10).map(l=>
      '<div style="border-top:2px dashed #EFE7D6;padding:10px 2px">' +
      '<div style="font-weight:800;font-size:15px">'+esc(l.titulo)+' <span style="color:#E0A400">'+'⭐'.repeat(l.nota||0)+'</span></div>' +
      (l.frase?'<div style="font-size:13.5px;color:var(--tinta-suave);font-weight:700;font-style:italic">“'+esc(l.frase)+'”</div>':'') +
      '</div>').join('') + '</div>';
  }
  return html + '</div>';
}
let notaLivro = 0;
function formLivro(){
  notaLivro = 0;
  abrirSheet('<div class="sheet-emoji">📖</div><div class="sheet-titulo">Qual livro você leu?</div>' +
    '<label>Nome do livro</label><input id="lv-titulo" placeholder="Escreva aqui o nome">' +
    '<label>Quantas estrelas ele merece?</label>' +
    '<div style="display:flex;justify-content:center;gap:6px;margin:6px 0">' +
      [1,2,3,4,5].map(n=>'<button class="estrelaNota" data-n="'+n+'" onclick="marcarNota('+n+')">⭐</button>').join('') + '</div>' +
    '<label>Conte em uma frase o que aconteceu</label><textarea id="lv-frase" rows="3" placeholder="Era uma vez..."></textarea>' +
    '<button class="btn btn-grande btn-verde" style="margin-top:14px" onclick="salvarLivro()">Guardar na estante ✨</button>');
}
function marcarNota(n){
  notaLivro = n;
  document.querySelectorAll('.estrelaNota').forEach(b=>{
    b.classList.toggle('on', parseInt(b.dataset.n,10) <= n);
  });
  nota(500+n*80, 0, .1);
}
function salvarLivro(){
  const titulo = document.getElementById('lv-titulo').value.trim();
  const frase = document.getElementById('lv-frase').value.trim();
  if(!titulo){ alert('Escreva o nome do livro.'); return; }
  if(!notaLivro){ alert('Dê as estrelinhas para o livro!'); return; }
  gravar('livros', uid(), { criancaId:criancaAtual, titulo:titulo, nota:notaLivro, frase:frase, ts:Date.now() });
  sfxFeito(); confete();
  falar('O livro '+titulo+' foi guardado na sua estante! Parabéns pela leitura!');
  fecharSheet(); renderCrianca();
}

/* ---------- motor do jogo ---------- */
let jogo = null;
function exAtual(){ return jogo.exs[jogo.atual]; }

function iniciarSessao(trilhaId){
  const t = TRILHAS[trilhaId];
  const pr = progTrilha(criancaAtual, trilhaId);
  const faseIdx = Math.min(pr.fase, t.fases.length-1);
  jogo = { trilhaId:trilhaId, faseIdx:faseIdx, exs:[], atual:0, acertosPrimeira:0, tentativa:0, contados:0, certa:null, opcoesAtual:[], fala:'' };
  const fase = t.fases[faseIdx];
  if(fase.pool){
    let itens = embaralhar(fase.pool.slice());
    while(itens.length < 5) itens = itens.concat(embaralhar(fase.pool.slice()));
    itens.slice(0,5).forEach(item=>{
      jogo.exs.push({ tipo:'texto', texto:item.t, pergunta:item.p, certa:item.o[0], opcoes:embaralhar(item.o.slice()) });
    });
  } else {
    for(let i=0;i<5;i++) jogo.exs.push(fase.gera());
  }
  renderJogoEx();
}

function shellJogo(pergunta, inner){
  let prog = '';
  jogo.exs.forEach((e,i)=>{ prog += '<div class="p'+(i<jogo.atual?' ok':'')+'"></div>'; });
  document.getElementById('jogoContainer').innerHTML =
    '<div class="jogoTela"><div class="jogoMiolo">' +
      '<div class="jogoTopo"><button class="mini-btn" onclick="fecharJogo()">✕</button>' +
      '<div class="jogoProg">'+prog+'</div>' +
      '<button class="mini-btn" onclick="falar(jogo.fala)">🔊</button></div>' +
      '<div class="jogoPergunta">'+pergunta+'</div>' + inner +
    '</div></div>';
}
function opcoesHtml(lista){
  return '<div class="opcoes" id="areaOpcoes">' +
    lista.map((v,i)=>'<button class="opcao" data-i="'+i+'" onclick="responder(this)">'+v+'</button>').join('') + '</div>';
}
function opcoesTextoHtml(lista){
  return '<div id="areaOpcoes" style="padding:6px 0 20px">' +
    lista.map((v,i)=>'<button class="opcao opcaoTexto" data-i="'+i+'" onclick="responder(this)">'+esc(v)+'</button>').join('') + '</div>';
}

function renderJogoEx(){
  const ex = exAtual();
  jogo.tentativa = 0; jogo.contados = 0; jogo.certa = ex.certa; jogo.opcoesAtual = ex.opcoes;
  let pergunta = '', inner = '';
  if(ex.tipo==='contar'){
    pergunta = 'Toque e conte! '+ex.emoji;
    jogo.fala = 'Toque em cada um e conte comigo!';
    let objs = '';
    for(let i=0;i<ex.qtd;i++) objs += '<button class="obj'+(ex.qtd>10?' mini':'')+'" onclick="contarObj(this)">'+ex.emoji+'</button>';
    inner = '<div class="objGrade">'+objs+'</div><div class="opcoes" id="areaOpcoes"></div>';
  }
  else if(ex.tipo==='quantos'){
    pergunta = 'Quantos você vê?';
    jogo.fala = 'Olhe bem, sem contar no dedo... quantos são?';
    let objs = '';
    for(let i=0;i<ex.qtd;i++) objs += '<span class="obj">'+ex.emoji+'</span>';
    inner = '<div class="objGrade">'+objs+'</div>' + opcoesHtml(ex.opcoes);
  }
  else if(ex.tipo==='depois'){
    pergunta = 'Qual vem depois?';
    jogo.fala = 'Qual número vem depois do '+ex.n+'?';
    inner = '<div style="display:flex;gap:14px;justify-content:center;align-items:center;flex:1">' +
      '<div class="numCard">'+ex.n+'</div><div class="numCard oco">?</div></div>' + opcoesHtml(ex.opcoes);
  }
  else if(ex.tipo==='antes'){
    pergunta = 'Qual vem antes?';
    jogo.fala = 'Qual número vem antes do '+ex.n+'?';
    inner = '<div style="display:flex;gap:14px;justify-content:center;align-items:center;flex:1">' +
      '<div class="numCard oco">?</div><div class="numCard">'+ex.n+'</div></div>' + opcoesHtml(ex.opcoes);
  }
  else if(ex.tipo==='entre'){
    pergunta = 'Qual fica no meio?';
    jogo.fala = 'Qual número fica entre o '+ex.a+' e o '+ex.b+'?';
    inner = '<div style="display:flex;gap:12px;justify-content:center;align-items:center;flex:1">' +
      '<div class="numCard">'+ex.a+'</div><div class="numCard oco">?</div><div class="numCard">'+ex.b+'</div></div>' + opcoesHtml(ex.opcoes);
  }
  else if(ex.tipo==='dezena'){
    pergunta = 'De 10 em 10… qual falta?';
    jogo.fala = 'Estamos contando de dez em dez. Qual número está faltando?';
    let chips = '';
    for(let i=1;i<=10;i++){
      const v = i*10;
      chips += '<div class="chipNum'+(v===ex.certa?' oco':'')+'">'+(v===ex.certa?'?':v)+'</div>';
    }
    inner = '<div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-content:center;flex:1;padding:10px 0">'+chips+'</div>' + opcoesHtml(ex.opcoes);
  }
  else if(ex.tipo==='cem'){
    pergunta = 'Qual número falta?';
    jogo.fala = 'Olhe esse pedacinho da trilha do cem. Qual número está faltando?';
    let chips = '';
    for(let i=0;i<10;i++){
      const v = ex.ini+i;
      chips += '<div class="chipNum'+(v===ex.certa?' oco':'')+'">'+(v===ex.certa?'?':v)+'</div>';
    }
    inner = '<div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-content:center;flex:1;padding:10px 0">'+chips+'</div>' + opcoesHtml(ex.opcoes);
  }
  else if(ex.tipo==='texto'){
    pergunta = 'Leia e responda 📖';
    jogo.fala = 'Leia a historinha com calma e escolha a melhor resposta. A leitura é toda sua!';
    inner = '<div class="cartaoHistoria">'+esc(ex.texto)+'</div>' +
      '<div class="perguntaTexto">'+esc(ex.pergunta)+'</div>' + opcoesTextoHtml(ex.opcoes);
  }
  shellJogo(pergunta, inner);
  if(ex.tipo!=='texto') setTimeout(()=>falar(jogo.fala), 350);
}

function contarObj(el){
  const ex = exAtual();
  if(el.classList.contains('contado')) return;
  el.classList.add('contado');
  jogo.contados++;
  nota(392 + jogo.contados*28, 0, .12, 'sine', .14);
  falar(''+jogo.contados);
  if(jogo.contados >= ex.qtd) setTimeout(mostrarQuantos, 750);
}
function mostrarQuantos(){
  const ex = exAtual();
  jogo.fala = 'E no total, quantos são?';
  falar(jogo.fala);
  const area = document.getElementById('areaOpcoes');
  if(area) area.outerHTML = opcoesHtml(ex.opcoes);
}

function responder(el){
  if(!jogo) return;
  const v = jogo.opcoesAtual[parseInt(el.dataset.i, 10)];
  const botoes = document.querySelectorAll('.opcao');
  if(v === jogo.certa){
    el.classList.add('certa');
    if(jogo.tentativa===0) jogo.acertosPrimeira++;
    botoes.forEach(b=>{ b.disabled = true; });
    sfxFeito();
    falar(['Isso!','Muito bem!','Acertou!','Boa!'][irand(4)]);
    setTimeout(proximoEx, typeof jogo.certa==='string' ? 1300 : 1000);
  } else {
    jogo.tentativa++;
    el.classList.add('errada'); el.disabled = true;
    sfxOps();
    if(jogo.tentativa >= 2){
      falar(typeof jogo.certa==='number'
        ? 'Esse é difícil! É o '+jogo.certa+'. Vamos para o próximo!'
        : 'Essa era difícil! Olha a resposta certinha marcada em verde. Vamos para a próxima!');
      botoes.forEach(b=>{
        if(jogo.opcoesAtual[parseInt(b.dataset.i,10)] === jogo.certa) b.classList.add('certa');
        b.disabled = true;
      });
      setTimeout(proximoEx, 1900);
    } else {
      falar('Quase! Tenta de novo.');
    }
  }
}
function proximoEx(){
  if(!jogo) return;
  jogo.atual++;
  if(jogo.atual >= jogo.exs.length){ fimSessao(); return; }
  renderJogoEx();
}

function fimSessao(){
  const t = TRILHAS[jogo.trilhaId];
  const chave = criancaAtual+'_'+jogo.trilhaId;
  const pr = progTrilha(criancaAtual, jogo.trilhaId);
  let fase = pr.fase||0, sess = (pr.sessoes||0)+1, dominou = false;
  const nomeFase = t.fases[Math.min(fase, t.fases.length-1)].nome;
  if(fase >= t.fases.length){ sess = 0; }
  else if(sess >= 3){ dominou = true; fase++; sess = 0; }
  gravar('trilhas', chave, { fase:fase, sessoes:sess });
  const completou = fase >= t.fases.length;
  let bonus = 0;
  if(dominou){
    bonus = Math.min(2, Math.max(0, LIMITE_TRILHA_DIA - estrelasTrilhaHoje(criancaAtual)));
    if(bonus>0) mover(criancaAtual, bonus, 'Dominou a fase "'+nomeFase+'" — '+t.nome+' 🎯', null);
  }
  confete(); sfxFeito();
  let tit, fala;
  if(dominou && completou){ tit = 'Trilha completa! 🏆'; fala = 'Uau! Você completou a trilha inteira! Parabéns!'; }
  else if(dominou && bonus>0){ tit = 'Fase dominada! 🎖️'; fala = 'Você dominou a fase '+nomeFase+' e ganhou '+(bonus===1?'uma estrela':'duas estrelas')+'! Uma fase nova abriu para você.'; }
  else if(dominou){ tit = 'Fase dominada! 🎖️'; fala = 'Você dominou a fase '+nomeFase+'! Uma fase nova abriu para você. Amanhã os jogos dão estrelas de novo!'; }
  else { tit = 'Mandou bem! 🎉'; fala = 'Sessão completa! Faltam '+(3-sess)+' para dominar essa fase.'; }
  falar(fala);
  document.getElementById('jogoContainer').innerHTML =
    '<div class="jogoTela"><div class="jogoMiolo" style="justify-content:center;text-align:center">' +
      '<div class="sheet-emoji">'+(dominou?(completou?'🏆':'🎖️'):'🎉')+'</div>' +
      '<div class="sheet-titulo">'+tit+'</div>' +
      '<div class="sheet-sub">'+jogo.acertosPrimeira+' de '+jogo.exs.length+' de primeira'+(bonus>0?' · +'+bonus+' ⭐':'')+'</div>' +
      '<button class="btn btn-grande btn-verde" onclick="iniciarSessao(\''+jogo.trilhaId+'\')">Jogar de novo ▶</button>' +
      '<button class="btn btn-grande btn-fantasma" style="margin-top:10px" onclick="fecharJogo()">Voltar</button>' +
    '</div></div>';
}
function fecharJogo(){
  document.getElementById('jogoContainer').innerHTML = '';
  jogo = null;
  if(criancaAtual) renderCrianca();
}

/* ============================================================
   INÍCIO
   ============================================================ */
function boot(){
  if(!MODO_FB){ load(); renderHome(); return; }
  firebase.initializeApp(firebaseConfig);
  auth = firebase.auth();
  fdb = firebase.firestore();
  db = bancoVazio();
  renderCarregando();
  /* login anônimo invisível: ninguém digita nada, o Firebase só precisa
     do provedor "Anônimo" ativado no console (Authentication > Sign-in method) */
  auth.onAuthStateChanged(u=>{
    usuarioAtual = u;
    if(!u){
      auth.signInAnonymously().catch(e=>{
        alert('Erro ao conectar (ative o login Anônimo no console do Firebase): '+(e && e.message ? e.message : e));
      });
      return;
    }
    seedSeVazio().then(ligarFirestore).catch(e=>{
      alert('Erro ao conectar no Firebase: '+(e && e.message ? e.message : e));
    });
  });
}
boot();
</script>
